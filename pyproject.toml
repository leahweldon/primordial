[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "primordial"
version = "0.4.0"
description = "An evolution sandbox: tiny neural-network creatures forage, fight and reproduce, and new species emerge over generations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Leah Weldon" }]
keywords = ["artificial-life", "evolution", "neuroevolution", "simulation", "numpy", "fastapi"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
primordial = "primordial.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primordial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731"]
